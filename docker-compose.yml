services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/code
    container_name: password-vault-api
    ports:
      - "8020:8020"
    env_file:
      - ./backend/.env
    deploy:
      resources:
        limits:
          memory: 250M
          cpus: 1
        reservations:
          memory: 128M

  db:
    image: postgres:17-alpine
    container_name: password-vault-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Optional: expose PostgreSQL to tools running on your computer.
    ports:
      - "5432:5433"

volumes:
  postgres_data:
